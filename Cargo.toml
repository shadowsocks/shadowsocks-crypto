[package]
name = "shadowsocks-crypto"
version = "0.7.0"
authors = ["luozijun <luozijun.assistant@gmail.com>", "ty <zonyitoo@gmail.com>"]
edition = "2021"
license = "MIT"
keywords = ["Cryptography"]
description = "Shadowsocks Crypto"
repository = "https://github.com/shadowsocks/shadowsocks-crypto"
documentation = "https://docs.rs/shadowsocks-crypto"
rust-version = "1.85"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["v1", "v1-aead"]
v1 = ["md-5", "cfg-if"]
v1-stream = ["v1", "chacha20", "aes", "ctr", "camellia"]
v1-aead = ["v1", "aes-gcm", "chacha20poly1305", "hkdf", "sha1"]
v1-aead-extra = [
    "v1-aead",
    "aes-gcm-siv",
    "ccm",
    "aes",
    "sm4",
    "ghash",
    "aead",
    "subtle",
    "ctr",
]
v2 = ["aes", "aes-gcm", "blake3", "chacha20poly1305", "bytes", "cfg-if"]
v2-extra = ["v2", "chacha20poly1305/reduced-round"]

ring = ["ring-compat"]
# Swap the pure-Rust AEAD/HKDF implementations for the AWS-LC-backed `aws-lc-rs`
# crate for higher throughput. Platforms not supported by aws-lc-rs (e.g. WASM,
# exotic targets) must leave this feature off and use the pure-Rust fallback.
aws-lc = ["dep:aws-lc-rs"]

[dependencies]
cfg-if = { version = "1.0", optional = true }
rand = "0.10"
aes-gcm = { version = "0.11", optional = true }
aes-gcm-siv = { version = "0.12", optional = true }
ccm = { version = "0.6", optional = true }
chacha20poly1305 = { version = "0.11", optional = true }
ring-compat = { version = "0.8", default-features = false, features = [
    "aead",
    "alloc",
], optional = true }
aws-lc-rs = { version = "1.16", optional = true }
md-5 = { version = "0.11", optional = true }
hkdf = { version = "0.13", optional = true }
sha1 = { version = "0.11", optional = true }
blake3 = { version = "1.8", optional = true }
chacha20 = { version = "0.10", features = [], optional = true }
aes = { version = "0.9", optional = true }
ctr = { version = "0.10", optional = true }
bytes = { version = "1.11", optional = true }
camellia = { version = "0.2", optional = true }
sm4 = { version = "0.6", optional = true }
ghash = { version = "0.6", optional = true }
aead = { version = "0.6", optional = true }
subtle = { version = "2.6", optional = true }

#[target.'cfg(all(unix, any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
#md-5 = { version = "0.10", features = ["asm"] }
#sha1 = { version = "0.10", features = ["asm"], optional = true }

#[target.'cfg(all(unix, target_arch = "aarch64", any(target_os = "linux", target_os = "macos")))'.dependencies]
#sha1 = { version = "0.10", features = ["asm"], optional = true }

#[target.'cfg(all(windows, any(target_arch = "x86", target_arch = "x86_64"), target_env = "gnu"))'.dependencies]
#md-5 = { version = "0.10", features = ["asm"] }
#sha1 = { version = "0.10", features = ["asm"], optional = true }

#[target.'cfg(all(windows, target_arch = "aarch64", target_env = "gnu"))'.dependencies]
#sha1 = { version = "0.10", features = ["asm"], optional = true }

[dev-dependencies]
hex = "0.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
